name: Build Docker Images

on:
  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 每周五 10:30 UTC 自动运行
  schedule:
    - cron: "30 10 * * 5"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: v2ray
            upstream: v2fly/v2ray-core
            context: ./docker/v2ray
            dockerfile: ./docker/v2ray/Dockerfile.architecture
            script: ./docker/v2ray/v2ray.sh
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64

          - image: xray
            upstream: XTLS/Xray-core
            context: ./docker/xray
            dockerfile: ./docker/xray/Dockerfile.architecture
            script: ./docker/xray/xray.sh
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 获取上游最新正式 Release 的版本号。
      # releases/latest 默认指向最新正式版，
      # 下面仍然再次检查 draft 和 prerelease 字段。
      - name: Resolve latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          set -euo pipefail

          release_json="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${UPSTREAM}/releases/latest"
          )"

          release_tag="$(jq -r '.tag_name' <<< "${release_json}")"
          draft="$(jq -r '.draft' <<< "${release_json}")"
          prerelease="$(jq -r '.prerelease' <<< "${release_json}")"

          if [ -z "${release_tag}" ] || [ "${release_tag}" = "null" ]; then
            echo "::error::Unable to resolve the latest release for ${UPSTREAM}"
            exit 1
          fi

          if [ "${draft}" != "false" ]; then
            echo "::error::Release ${release_tag} is a draft"
            exit 1
          fi

          if [ "${prerelease}" != "false" ]; then
            echo "::error::Release ${release_tag} is a pre-release"
            exit 1
          fi

          # 仅移除开头的一个小写 v。
          # 例如：v5.51.2 -> 5.51.2
          version="${release_tag#v}"

          if [ -z "${version}" ]; then
            echo "::error::Invalid release version: ${release_tag}"
            exit 1
          fi

          echo "Upstream release tag: ${release_tag}"
          echo "Docker image version: ${version}"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"

          echo "Image name: ${image_name}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      # 将脚本中的 releases/latest/download 临时替换为本次查询到的
      # 具体版本地址，保证镜像版本标签与实际下载的核心版本一致。
      # 这里只修改 Actions Runner 的临时工作目录，不会修改仓库文件。
      - name: Pin release version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail

          sed -i \
            "s#/releases/latest/download/#/releases/download/${RELEASE_TAG}/#g" \
            "${SCRIPT}"

          echo "Pinned ${SCRIPT} to ${RELEASE_TAG}"

          grep "/releases/download/${RELEASE_TAG}/" "${SCRIPT}" > /dev/null || {
            echo "::error::Failed to pin the release URL in ${SCRIPT}"
            exit 1
          }

      - name: Show build information
        shell: bash
        run: |
          echo "Image:       ${{ steps.image.outputs.name }}"
          echo "Release tag: ${{ steps.release.outputs.release_tag }}"
          echo "Version:     ${{ steps.release.outputs.version }}"
          echo "Platforms:   ${{ matrix.platforms }}"
          echo
          echo "Tags:"
          echo "  ${{ steps.image.outputs.name }}:latest"
          echo "  ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}

          push: true
          pull: true

          # 防止复用旧版本下载层
          no-cache: true

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.description=Latest stable ${{ matrix.image }} Docker image

          provenance: false

      # 记录实际推送成功的镜像信息
      - name: Generate build status
        shell: bash
        env:
          NAME: ${{ matrix.image }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail

          # 验证镜像 Digest
          if [[ ! "${DIGEST}" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Invalid image digest: ${DIGEST}"
            exit 1
          fi

          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 生成单个镜像的构建记录
          jq -n \
            --arg image "${IMAGE}" \
            --arg version "${VERSION}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg built_at "${BUILT_AT}" \
            --arg platforms "${PLATFORMS}" \
            '{
              image: $image,
              version: $version,
              release_tag: $release_tag,
              digest: $digest,
              built_at: $built_at,
              platforms: ($platforms | split(","))
            }' > "${RUNNER_TEMP}/build-status-${NAME}.json"

          echo "Generated build status:"
          cat "${RUNNER_TEMP}/build-status-${NAME}.json"

      # 上传临时记录，交给下一个 Job 汇总
      - name: Upload build status
        uses: actions/upload-artifact@v7
        with:
          name: build-status-${{ matrix.image }}
          path: ${{ runner.temp }}/build-status-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 7

  # 两个镜像全部成功后，统一更新仓库构建记录
  update-status:
    name: Update Build Status
    runs-on: ubuntu-latest

    needs: build

    # 仅在默认分支执行仓库写入
    if: github.ref_name == github.event.repository.default_branch

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download build status
        uses: actions/download-artifact@v8
        with:
          pattern: build-status-*
          path: ${{ runner.temp }}/build-status
          merge-multiple: true

      # 汇总 V2Ray 与 Xray 的构建记录
      - name: Generate build-status.json
        shell: bash
        run: |
          set -euo pipefail

          STATUS_DIR="${RUNNER_TEMP}/build-status"

          # 确认两个构建结果均已获取
          for image in v2ray xray; do
            if [ ! -s "${STATUS_DIR}/build-status-${image}.json" ]; then
              echo "::error::Missing build status for ${image}"
              exit 1
            fi
          done

          mkdir -p docker

          jq -s \
            --arg updated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              updated_at: $updated_at,
              images: (
                map({
                  key: (.image | split("/") | last),
                  value: .
                }) | from_entries
              )
            }' \
            "${STATUS_DIR}/build-status-v2ray.json" \
            "${STATUS_DIR}/build-status-xray.json" \
            > docker/build-status.json

          echo "Combined build status:"
          cat docker/build-status.json

      # 将构建结果提交到仓库默认分支
      - name: Commit build status
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docker/build-status.json

          if git diff --cached --quiet; then
            echo "No build status changes"
            exit 0
          fi

          git commit -m "chore: update Docker build status"

          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
